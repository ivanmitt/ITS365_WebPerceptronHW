<!DOCTYPE html>
<html>
<head>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 50px);
            grid-gap: 5px;
            margin-bottom: 20px;
        }
        .pixel {
            width: 50px;
            height: 50px;
            border: 1px solid #333;
            background-color: white;
            cursor: pointer;
        }
        .pixel.active {
            background-color: black;
        }
    </style>
</head>
<body>
    <h3>Draw a T or L</h3>
    <div class="grid" id="pixelGrid"></div>

    <button id="predict">Predict</button>
    <p id="output"></p>

    <script>
        const weights = [-0.2,-1.6,1.4,1.2,
                         -1.0,-1.4,1.8,1.4,
                         -0.4,1.0,-0.4,0.8,
                         -1.4,2.12,-0.4,-1.8]; 
        const bias = -2;

        const gridElement = document.getElementById('pixelGrid');
        const pixels = [];

        for (let i = 0; i < 16; i++) {
            const div = document.createElement('div');
            div.classList.add('pixel');
            div.dataset.state = "0";
            
            div.onclick = function() {
                if (this.dataset.state === "0") {
                    this.dataset.state = "1";
                    this.classList.add('active');
                } else {
                    this.dataset.state = "0";
                    this.classList.remove('active');
                }
            };
            gridElement.appendChild(div);
            pixels.push(div);
        }

        function getSwitchValues() {
            return pixels.map(p => parseInt(p.dataset.state));
        }

        function activation_function(z) {
            return z >= 0 ? 1 : -1;
        }

        function predict(inputs) {
            let linear_product = 0;
            for (let i = 0; i < weights.length; i++) {
                linear_product += inputs[i] * weights[i];
            }
            linear_product += bias;
            return activation_function(linear_product);
        }

        document.getElementById('predict').onclick = function() {
            let currentInputs = getSwitchValues(); 
            let result = predict(currentInputs);
            document.getElementById('output').innerText = (result === 1) ? "It's a T" : "It's an L";
        };
    </script>
</body>
</html>
